[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gateway-server"
version = "0.1.0"
description = "【上层·审批】审批网关 MCP server：统一入口 / 聚合器 / HITL 审批 / 审计 / 路由"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "mcp-shared>=0.1.0",
]

[project.scripts]
gateway-server = "mcp_gateway.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.uv.sources]
mcp-shared = { workspace = true }

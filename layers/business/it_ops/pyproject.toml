[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-itops-server"
version = "0.1.0"
description = "【中层·IT运维】IT 运维系统 MCP server（试点）：工单 / 变更 / 资产"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "mcp-shared>=0.1.0",
]

[project.scripts]
itops-server = "mcp_itops.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_itops"]

[tool.uv.sources]
mcp-shared = { workspace = true }

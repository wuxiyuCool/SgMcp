[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-purchasing-server"
version = "0.1.0"
description = "【中层·采购】采购系统 MCP server（预留）"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "mcp-shared>=0.1.0",
]

[project.scripts]
purchasing-server = "mcp_purchasing.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_purchasing"]

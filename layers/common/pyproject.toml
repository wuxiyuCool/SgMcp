[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-common-server"
version = "0.1.0"
description = "【下层】通用工具 MCP server：与业务无关的通用能力"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    # Windows 无系统时区库，zoneinfo 解析 IANA 时区（Asia/Shanghai 等）需要它
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
common-server = "mcp_common_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_common_server"]
